name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint --if-present

  verify-tarball:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the packed tarball is consumable under strict TypeScript
        run: npm run verify:tarball

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --omit=dev: this is a library (packages/core, the only published
      # workspace) with three runtime dependencies — everything else in the
      # tree (vitest, vite, typescript, react, ...) is test/build tooling
      # that never reaches a consumer's install. A full audit fails on
      # devDependency transitives no `opentel-mcp` user is ever exposed to,
      # which trains reviewers to ignore this job; --omit=dev checks what
      # actually ships.
      #
      # --audit-level=high: `npm audit` prints every finding regardless of
      # this flag — it only controls the exit code. Gating on `high` means
      # routine low/moderate transitive advisories (common, usually not
      # meaningfully exploitable through this library's own usage) don't
      # block an unrelated PR, while a genuinely serious finding still
      # fails the build instead of sitting in a log nobody reads.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
