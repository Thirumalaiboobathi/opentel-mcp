name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint --if-present

  verify-tarball:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # packages/ui's own verify:tarball (ADR 022,
      # docs/adr/022-publish-ui.md) needs dist/index.html already built.
      - name: Build
        run: npm run build

      - name: Verify the packed tarball is consumable under strict TypeScript (core) and installs/runs cleanly (ui)
        run: npm run verify:tarball

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This job must audit only what packages/core and packages/ui
      # (ADR 022, docs/adr/022-publish-ui.md) actually ship — not this
      # monorepo's own dev tooling, and not examples/* (real npm
      # workspaces with their own real, non-dev @modelcontextprotocol/sdk
      # dependency, pulling in express/hono/ajv transitively). `npm audit`,
      # even with `--omit=dev` and even run from inside packages/core/,
      # scans the ENTIRE installed tree regardless of cwd or `--workspace`
      # (confirmed empirically — both still report examples/*'s findings);
      # there is no flag that actually scopes the scan itself, only ones
      # that filter which project's package.json is treated as "the root"
      # for reporting, which doesn't change what gets scanned. So each
      # package is packed and installed into its own clean, throwaway
      # project below — the exact dependency tree a real `npm install
      # opentel-mcp` / `npm install opentel-mcp-ui` produces, nothing
      # hoisted in from a sibling workspace — and audited there instead.
      # Same two-package split `verify:tarball` already makes, for the
      # same underlying reason (packages/core and packages/ui are the
      # only two workspaces anyone actually installs).
      #
      # --audit-level=high: `npm audit` prints every finding regardless of
      # this flag — it only controls the exit code. Gating on `high` means
      # routine low/moderate transitive advisories (common, usually not
      # meaningfully exploitable through this library's own usage) don't
      # block an unrelated PR, while a genuinely serious finding still
      # fails the build instead of sitting in a log nobody reads.
      - name: Audit packages/core's actual published dependency tree
        run: |
          set -e
          pack_dir=$(mktemp -d)
          consumer_dir=$(mktemp -d)
          npm pack --workspace=packages/core --pack-destination "$pack_dir"
          cd "$consumer_dir"
          npm init -y >/dev/null
          npm install "$pack_dir"/opentel-mcp-*.tgz
          npm audit --omit=dev --audit-level=high

      - name: Audit packages/ui's actual published dependency tree
        run: |
          set -e
          pack_dir=$(mktemp -d)
          consumer_dir=$(mktemp -d)
          npm pack --workspace=packages/ui --pack-destination "$pack_dir"
          cd "$consumer_dir"
          npm init -y >/dev/null
          npm install "$pack_dir"/opentel-mcp-ui-*.tgz
          npm audit --omit=dev --audit-level=high

  # --- Python port (ADR 028, docs/adr/028-python-port.md) -----------------------------------------
  # 13 jobs, listed explicitly (not a cross product): ubuntu x 5 Pythons x {latest mcp 1.x, latest mcp 2.x},
  # plus macOS and Windows on the newest Python with mcp 2.x, plus the oldest supported pairing
  # (Python 3.10 with mcp 1.25). Inside every 2.x job pytest also parametrizes both `sdk_tracing` modes and
  # "SDK middleware already removed", and runs the contract pins for mcp's private surface.
  python:
    name: python ${{ matrix.python }} / mcp ${{ matrix.label }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", mcp: "mcp>=1.25,<2", label: "latest 1.x" }
          - { os: ubuntu-latest, python: "3.10", mcp: "mcp>=2,<3", label: "latest 2.x" }
          - { os: ubuntu-latest, python: "3.11", mcp: "mcp>=1.25,<2", label: "latest 1.x" }
          - { os: ubuntu-latest, python: "3.11", mcp: "mcp>=2,<3", label: "latest 2.x" }
          - { os: ubuntu-latest, python: "3.12", mcp: "mcp>=1.25,<2", label: "latest 1.x" }
          - { os: ubuntu-latest, python: "3.12", mcp: "mcp>=2,<3", label: "latest 2.x" }
          - { os: ubuntu-latest, python: "3.13", mcp: "mcp>=1.25,<2", label: "latest 1.x" }
          - { os: ubuntu-latest, python: "3.13", mcp: "mcp>=2,<3", label: "latest 2.x" }
          - { os: ubuntu-latest, python: "3.14", mcp: "mcp>=1.25,<2", label: "latest 1.x" }
          - { os: ubuntu-latest, python: "3.14", mcp: "mcp>=2,<3", label: "latest 2.x" }
          - { os: macos-latest, python: "3.14", mcp: "mcp>=2,<3", label: "latest 2.x" }
          - { os: windows-latest, python: "3.14", mcp: "mcp>=2,<3", label: "latest 2.x" }
          # oldest supported: the floor of the supported range
          - { os: ubuntu-latest, python: "3.10", mcp: "mcp==1.25.*", label: "1.25 (oldest)" }
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      # The end-to-end test starts the real opentel-mcp-ui, so it only runs on the ubuntu legs (it skips itself
      # when the monorepo's node_modules are absent).
      - name: Use Node.js 22 (end-to-end test with the real dashboard)
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the dashboard
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: .
        run: |
          npm ci
          npm run build --workspace=packages/ui

      # setup-uv@v5 with `python-version` also creates and activates a venv at the repo root, so a bare
      # `uv pip install` would put the SDK there instead of in the project's packages/python/.venv that
      # `uv run` uses (pytest then fails at collection). `--python .venv` targets the project env explicitly.
      # setup-uv's root venv is exported as VIRTUAL_ENV; unsetting it for the uv steps silences uv's
      # "does not match the project environment" warning. The project's .venv is used either way.
      - name: Install dependencies (uv.lock) and the mcp SDK under test
        shell: bash
        run: |
          unset VIRTUAL_ENV
          uv sync --locked --group test
          uv pip install --python .venv "${{ matrix.mcp }}"
          uv run --no-sync python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"

      - name: Lint
        shell: bash
        run: |
          unset VIRTUAL_ENV
          uv run --no-sync ruff check .

      - name: Format check
        shell: bash
        run: |
          unset VIRTUAL_ENV
          uv run --no-sync ruff format --check .

      - name: Type check
        shell: bash
        run: |
          unset VIRTUAL_ENV
          uv run --no-sync mypy

      # Failed test ids are also surfaced as annotations so they are readable without the raw job log.
      - name: Test
        shell: bash
        run: |
          set +e
          unset VIRTUAL_ENV
          uv run --no-sync pytest --cov=opentel_mcp --cov-report=term-missing --tb=short 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while IFS= read -r line; do echo "::error::${line:0:500}"; done
          exit $status

  # The shared conformance suite (ADR 028 Decision 6): core generates the fixtures, then both implementations
  # assert them. Neither side needs the mcp SDK for this.
  conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Fixtures are up to date with core
        run: node packages/core/scripts/gen-conformance.mjs --check

      - name: JS conformance and contract tests
        run: npx vitest run test/conformance
        working-directory: packages/core

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Python conformance and contract tests
        working-directory: packages/python
        shell: bash
        run: |
          unset VIRTUAL_ENV
          uv sync --locked --group test
          uv run --no-sync pytest tests/conformance tests/test_contract.py -p no:cacheprovider
