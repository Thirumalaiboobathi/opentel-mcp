name: Release

# Triggered by `git push --tags` (CONTRIBUTING.md's "Release checklist",
# step 5) — `npm version <bump>` already creates a `vX.Y.Z` tag from the
# exact commit whose package.json carries that version, so publishing off
# the tag publishes the version that's actually in the tree, atomically.
# No change to steps 1-5 of that checklist; this replaces step 6 (`npm
# publish`, previously run by hand) with the same command run here instead,
# plus `--provenance` — which npm can only generate inside a supported CI
# provider's OIDC context (GitHub Actions), never from a local machine.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm to obtain the OIDC token `--provenance` signs the
      # published package against — the attestation links this exact run
      # and commit to what gets published.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Re-verified here, not merely trusted from whatever ran before the
      # tag was pushed: a tag pushed without following the local checklist
      # (or pushed from a stale branch) must not reach npm just because a
      # human meant to run these first. `verify:tarball` is also wired into
      # packages/core's own `prepublishOnly`, so `npm publish` below fails
      # closed on it regardless — this is a second, earlier checkpoint, not
      # the only one, so a bad release fails before the publish attempt.
      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # packages/ui's own verify:tarball (ADR 022,
      # docs/adr/022-publish-ui.md) checks dist/index.html is built and
      # non-trivial-sized before installing the packed tarball — build
      # must run first. packages/core's own `build` stays a no-op (plain
      # JS, no build step), so this was never needed before packages/ui
      # had something to build.
      - name: Build
        run: npm run build

      - name: Verify the packed tarball is consumable under strict TypeScript (core) and installs/runs cleanly (ui)
        run: npm run verify:tarball

      # Both packages/core and packages/ui are published as of ADR 022
      # (docs/adr/022-publish-ui.md) — packages/ui's "private": true was
      # removed when it was published for the first time. The workspace
      # root itself stays "private": true; it's never a publish target.
      #
      # The two packages have independent release cadences (ADR 022: "no
      # future UI release requires a simultaneous core release unless the
      # UI adds a feature that needs a newer core") -- but this workflow
      # triggers on ANY vX.Y.Z tag, which `npm version` only ever bumps for
      # ONE package at a time. Publishing both unconditionally on every tag
      # would make a core-only release attempt to re-publish packages/ui's
      # already-published version (409) and vice versa, breaking a release
      # that should have succeeded. Each publish step below is therefore
      # gated on "is this package's current version already on the
      # registry" -- `npm view <pkg>@<version>` exits non-zero when it
      # isn't published yet, which is exactly the "needs publishing" signal;
      # a 404 for a name that's never been published at all (packages/ui's
      # very first release) behaves the same way. `--provenance` requires
      # the id-token: write permission above and a supported CI provider;
      # authentication itself still comes from NODE_AUTH_TOKEN (an npm
      # automation token stored as the NPM_TOKEN repo secret), which
      # provenance does not replace.
      - name: Publish packages/core to npm (if this version isn't already published)
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          if npm view "opentel-mcp@$CORE_VERSION" version >/dev/null 2>&1; then
            echo "opentel-mcp@$CORE_VERSION is already published -- skipping."
          else
            npm publish --workspace=packages/core --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages/ui to npm (if this version isn't already published)
        run: |
          UI_VERSION=$(node -p "require('./packages/ui/package.json').version")
          if npm view "opentel-mcp-ui@$UI_VERSION" version >/dev/null 2>&1; then
            echo "opentel-mcp-ui@$UI_VERSION is already published -- skipping."
          else
            npm publish --workspace=packages/ui --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
