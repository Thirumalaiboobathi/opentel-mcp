# OpenSSF Scorecard: supply-chain security checks, results published to the OpenSSF API (for the badge) and
# uploaded to code scanning.
# Source: https://github.com/ossf/scorecard-action (README: publishing results requires id-token: write,
# no workflow-level env/defaults/write permissions, and only the allow-listed actions in the job:
# actions/checkout, actions/upload-artifact, github/codeql-action/upload-sarif, ossf/scorecard-action).
# Supported triggers for publishing: push and schedule on the default branch (+ branch_protection_rule).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 2" # weekly, Tuesday 03:41 UTC
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results (OIDC) for the badge
      contents: read
      actions: read # read workflow run metadata (used by the analysis action)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
