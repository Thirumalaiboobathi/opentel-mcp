[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opentel-mcp"
version = "0.1.0"
description = "One-line OpenTelemetry instrumentation for Model Context Protocol (MCP) servers built on the official Python SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Thirumalaiboobathi B" }]
keywords = ["mcp", "model-context-protocol", "opentelemetry", "otel", "observability", "tracing", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
# `mcp` is deliberately not a dependency: an instrumentation library should not
# choose the host's SDK version. Supported: mcp>=1.25,<3 (detected at runtime).
dependencies = ["opentelemetry-api>=1.28"]

[project.optional-dependencies]
# Dev mode (`setup_sdk=True`) needs the SDK to build a tracer/meter provider.
dev = ["opentelemetry-sdk>=1.28"]

[project.urls]
Homepage = "https://github.com/Thirumalaiboobathi/opentel-mcp"
Repository = "https://github.com/Thirumalaiboobathi/opentel-mcp"
Issues = "https://github.com/Thirumalaiboobathi/opentel-mcp/issues"

[dependency-groups]
test = [
  "pytest>=8",
  "anyio>=4",
  "pytest-cov>=5",
  "opentelemetry-sdk>=1.28",
  "mypy>=1.11",
  "ruff>=0.6",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentel_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/opentel_mcp", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: starts the real opentel-mcp-ui dashboard (needs node)"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/opentel_mcp"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM300"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "RUF012"]

[tool.coverage.run]
source = ["opentel_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
